    .chipt { font: 600 10.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #CFCAC0; letter-spacing: .04em; }
    
    .arr { fill: none; stroke: #CFCAC0; stroke-width: 1.3; marker-end: url(#ar); }
    .arrc { fill: none; stroke: #F0935C; stroke-width: 1.6; marker-end: url(#arc); }
