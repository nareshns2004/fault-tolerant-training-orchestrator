<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-labelledby="t d">
<title id="t">goodput architecture</title>
<desc id="d">Each node runs ranks with lightweight hooks and a node agent with collectors. The controller's state machine, correlator (the topology join), classifier and policy turn anomalies into evidence-backed actions. faultlab injects faults and keeps the ground-truth ledger outside the system under test; only bench sees both.</desc>
<defs><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#86A8FF"/><stop offset=".6" stop-color="#F0935C"/><stop offset="1" stop-color="#FF7D73"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#CFCAC0"/></marker><marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F0935C"/></marker></defs>
<style>
