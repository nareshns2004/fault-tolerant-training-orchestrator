<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="t d">
<title id="t">goodput: symptoms are global, causes are local</title>
<desc id="d">Two nodes of four GPUs under a leaf switch. node-1's NIC link fails; evidence from the flight recorder, RDMA counters and DCGM converges on one verdict naming the port, not just the first rank to time out. Illustrative, not a measurement.</desc>
<defs><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#1D4ED8"/><stop offset=".6" stop-color="#B4470E"/><stop offset="1" stop-color="#C2261D"/></linearGradient></defs>
<style>
    .kick { font: 700 12.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: .14em; fill: #15171C; }
    .kick2 { font: 600 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: .1em; fill: #555C6A; }
    .h { font: 650 25px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #15171C; letter-spacing: -.014em; }
    .sub { font: 500 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #353A44; }
    .cap { font: 600 10.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #555C6A; letter-spacing: .06em; }
    .lbl { font: 600 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #15171C; }
    .lbl2 { font: 500 10.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #555C6A; }
    .title { font: 650 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #15171C; }
    .box { fill: #EFECE4; stroke: #BDB6A6; stroke-width: 1.2; }
    .card { fill: #F7F5F0; stroke: #15171C; stroke-width: 1.3; }
    .wire { fill: none; stroke: #BDB6A6; stroke-width: 1.4; }
    .ink { fill: none; stroke: #15171C; stroke-width: 1.4; }
    .sig { fill: none; stroke: #1D4ED8; stroke-width: 1.6; }
    .cu { fill: none; stroke: #B4470E; stroke-width: 1.8; }
    .dash { stroke-dasharray: 4 4; }
    .fs { fill: #1D4ED8; } .fc { fill: #B4470E; } .ff { fill: #C2261D; }
    .fg { fill: #555C6A; } .fi { fill: #15171C; } .fp { fill: #F7F5F0; }
    .chip { fill: #F7F5F0; stroke: #BDB6A6; stroke-width: 1; }
    .chipt { font: 600 10.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #353A44; letter-spacing: .04em; }
    
    .gpu { fill: #F7F5F0; stroke: #15171C; stroke-width: 1.2; }
    .stuck { stroke: #B4470E; stroke-width: 2; }
    .nic { fill: #F7F5F0; stroke: #15171C; stroke-width: 1.2; }
    .bad { fill: #C2261D; stroke: #C2261D; stroke-width: 2; fill-opacity: .22;
            animation: bad 9s ease-in-out infinite; }
    @keyframes bad { 0%, 30% { fill-opacity: 0; stroke-opacity: .2; }
                     36%, 100% { fill-opacity: .22; stroke-opacity: 1; } }
    .badl { stroke: #C2261D; stroke-width: 1.8; fill: none; stroke-dasharray: 3 4;
             animation: badl 9s linear infinite; }
    @keyframes badl { 0%, 30% { opacity: 0; } 36%, 100% { opacity: 1; } }
    .ev1 { animation: ev1 9s step-end infinite; }
    .ev2 { animation: ev2 9s step-end infinite; }
    .ev3 { animation: ev3 9s step-end infinite; }
    .vd { animation: vd 9s step-end infinite; }
    @keyframes ev1 { 0% { opacity: .25; } 42% { opacity: 1; } }
    @keyframes ev2 { 0% { opacity: .25; } 52% { opacity: 1; } }
    @keyframes ev3 { 0% { opacity: .25; } 62% { opacity: 1; } }
    @keyframes vd { 0% { opacity: 0; } 72% { opacity: 1; } }
    .flow { stroke-dasharray: 2 5; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -14; } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="880" height="300" rx="12" fill="#F7F5F0"/>
<rect x="24" y="14" width="832" height="3" rx="1.5" fill="url(#acc)"/>
<text x="32" y="58" class="kick">GOODPUT</text>
<text x="32" y="78" class="kick2">FAULT ATTRIBUTION · MULTI-NODE LLM TRAINING</text>
<text x="32" y="124" class="h">Symptoms are global.</text>
<text x="32" y="156" class="h">Causes are <tspan class="fc">local</tspan>.</text>
<text x="32" y="190" class="sub">flight recorder × DCGM × RDMA counters</text>
<text x="32" y="208" class="sub">→ topology join → culprit rank + component</text>
<text x="32" y="226" class="sub">→ the smallest safe recovery</text>
