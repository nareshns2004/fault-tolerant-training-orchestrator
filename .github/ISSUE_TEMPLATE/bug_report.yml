name: Bug report
description: Something in goodput, faultlab or bench behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Safety issues** (a way around the host allowlist, revert watchdog or destructive
        opt-in) are security issues: report them privately, see SECURITY.md.
        Do not paste hostnames, IPs, serials or logs from hardware you are not cleared to share.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Commands, scenario YAML, or a failing test.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: goodput version / commit, Python, OS; for hardware runs, the env manifest (scrubbed).
